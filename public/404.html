<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>pet-hospital</title>
    <script>
      // GitHub Pages SPA 重定向
      // 将 404 请求重定向到 index.html，保留路径信息
      const path = window.location.pathname;
      const repo = '/pet-hospital';
      if (path.startsWith(repo)) {
        const route = path.slice(repo.length) || '/';
        sessionStorage.setItem('redirect', route + window.location.search);
        window.location.replace(repo + '/');
      }
    </script>
  </head>
  <body>
  </body>
</html>
